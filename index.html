<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Courrier</title>
<link rel="icon" type="image/svg+xml" href="icone.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1d55d6">
<style>
  :root {
    --fond: #f6f5f2; --panneau: #ffffff; --ligne: #e3e0d9; --texte: #23221f; --doux: #6f6b63;
    --accent: #2f6fb3; --survol: #eef2f8; --sel: #e2ebf6;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; color: var(--texte); background: var(--fond); height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--ligne); background: var(--panneau); }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .2px; }
  header .esp { flex: 1; }
  header input[type=search] { width: 320px; padding: 6px 10px; border: 1px solid var(--ligne); border-radius: 8px; font: inherit; }
  button { font: inherit; border: 1px solid var(--ligne); background: var(--panneau); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
  button:hover { background: var(--survol); }
  button.principal { background: var(--accent); color: #fff; border-color: var(--accent); }
  main { flex: 1; display: grid; grid-template-columns: 240px 400px 1fr; min-height: 0; }
  nav, #liste, #lecture { overflow: auto; min-height: 0; }
  nav { border-right: 1px solid var(--ligne); padding: 10px 0; background: #fbfaf8; }
  nav h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--doux); margin: 14px 16px 4px; }
  .entree { display: flex; align-items: center; gap: 8px; padding: 5px 16px; cursor: pointer; border-left: 3px solid transparent; }
  .entree:hover { background: var(--survol); }
  .entree.actif { background: var(--sel); border-left-color: var(--accent); font-weight: 600; }
  .entree.cible { background: #dff0e2; outline: 2px dashed #3f8f4f; outline-offset: -2px; }
  .pastille { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .entree .nb { margin-left: auto; font-size: 12px; color: var(--doux); }
  #liste { border-right: 1px solid var(--ligne); background: var(--panneau); }
  .msg { padding: 9px 14px; border-bottom: 1px solid var(--ligne); cursor: pointer; }
  .msg:hover { background: var(--survol); }
  .msg.sel { background: var(--sel); }
  .msg.nonlu .de, .msg.nonlu .obj { font-weight: 700; }
  .msg .l1 { display: flex; gap: 8px; align-items: baseline; }
  .msg .de { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .msg .date { font-size: 12px; color: var(--doux); flex: none; }
  .msg .obj { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .msg .ext { font-size: 12.5px; color: var(--doux); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .etiq { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 6px; color: #fff; margin-right: 4px; vertical-align: 1px; }
  #lecture { padding: 18px 22px; background: var(--panneau); display: flex; flex-direction: column; }
  #lecture h2 { margin: 0 0 6px; font-size: 18px; }
  .meta { color: var(--doux); font-size: 13px; margin-bottom: 10px; }
  .barre { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 6px 0 12px; }
  select { font: inherit; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--ligne); }
  iframe { flex: 1; width: 100%; border: 1px solid var(--ligne); border-radius: 8px; min-height: 400px; background: #fff; }
  pre.texte { white-space: pre-wrap; font: inherit; }
  .pj { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .pj span { border: 1px solid var(--ligne); border-radius: 8px; padding: 3px 8px; font-size: 12.5px; }
  .vide { color: var(--doux); padding: 30px; text-align: center; }
  #accueil { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; }
  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #23221f; color: #fff; padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.vu { opacity: .92; }
  .plus { text-align: center; padding: 10px; }
  .filtres { position: sticky; top: 0; z-index: 1; background: var(--panneau); display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--ligne); }
  .filtres button { padding: 3px 9px; font-size: 12.5px; border-radius: 14px; }
  .filtres button.actif { background: var(--accent); color: #fff; border-color: var(--accent); }
  .imp { color: #e3a008; font-size: 13px; margin-right: 2px; }
  .onglets { position: sticky; top: 0; z-index: 1; background: var(--panneau); display: flex; border-bottom: 1px solid var(--ligne); overflow-x: auto; }
  .onglets button { border: 0; border-bottom: 3px solid transparent; border-radius: 0; padding: 10px 12px; background: none; white-space: nowrap; font-size: 13px; color: var(--doux); }
  .onglets button.actif { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .badge { display: inline-block; font-size: 10.5px; color: #fff; border-radius: 8px; padding: 0 5px; margin-left: 4px; font-weight: 600; }
  .etoile { cursor: pointer; color: #b8b3a8; font-size: 15px; margin-right: 4px; }
  .etoile.oui { color: #e3a008; }
  .nbfil { color: var(--doux); font-size: 12px; margin-left: 4px; }
  .carte { border: 1px solid var(--ligne); border-radius: 8px; margin-bottom: 10px; }
  .carte .tete { padding: 10px 12px; cursor: pointer; display: flex; gap: 10px; align-items: baseline; border-radius: 8px; }
  .carte .tete:hover { background: var(--sel); }
  .carte .tete .chev-m { color: var(--doux); font-size: 11px; transition: transform .15s; flex: none; }
  .carte .tete.ouvert .chev-m { transform: rotate(90deg); }
  .carte .tete .rep-tete { flex: none; padding: 0 7px; font-size: 13px; line-height: 20px; }
  .carte .tete b { flex: none; }
  .carte .tete .ex { flex: 1; color: var(--doux); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
  .carte .tete .dt { color: var(--doux); font-size: 12px; flex: none; }
  .carte .corps { padding: 0 12px 12px; }
  .carte iframe { min-height: 120px; flex: none; }
  .carte.brouillon { border-color: #e8a33d; background: #fffaf1; }
  .carte .tag { font-size: 11px; color: #9a5b00; background: #fde7c2; border-radius: 6px; padding: 0 6px; flex: none; }
  .actions-brouillon { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  #redaction { border-color: var(--accent); }
  .champs-r { display: grid; grid-template-columns: 44px 1fr; gap: 4px 8px; align-items: center; margin-top: 6px; font-size: 13px; }
  .champs-r label { color: var(--doux); }
  .champs-r input { padding: 4px 7px; border: 1px solid var(--ligne); border-radius: 6px; font: inherit; }
  .rep-msg { display: flex; gap: 6px; margin-top: 6px; }
  .rep-msg button { font-size: 12px; padding: 2px 8px; }
  #redaction textarea { width: 100%; box-sizing: border-box; margin-top: 8px; padding: 8px 10px; border: 1px solid var(--ligne); border-radius: 8px; font: 14px/1.5 inherit; font-family: inherit; resize: vertical; }
  .pj button { font-size: 12.5px; padding: 3px 8px; }
  /* Classeurs repliables de la barre de gauche */
  nav h2.classeur { cursor: pointer; display: flex; align-items: center; gap: 6px; user-select: none; }
  nav h2.classeur:hover { color: var(--texte); }
  nav h2.classeur .chev { display: inline-block; width: 10px; transition: transform .15s; }
  nav h2.classeur.replie .chev { transform: rotate(-90deg); }
  nav h2.classeur .nbc { margin-left: auto; margin-right: 10px; }
  .alerte { background: #c0392b; color: #fff; border-radius: 9px; padding: 0 6px; font-size: 11px; font-weight: 700; }
  /* Tableau de suivi (Kanban) */
  main.kanban { grid-template-columns: 240px 1fr; }
  main.kanban #lecture { display: none; }
  main.kanban.ouvert { grid-template-columns: 240px 1fr 520px; }
  main.kanban.ouvert #lecture { display: flex; border-left: 1px solid var(--ligne); }
  .fermer-l { align-self: flex-end; margin-bottom: 6px; font-size: 12.5px; padding: 3px 9px; }
  .tableau { display: flex; flex-direction: column; height: 100%; }
  .tableau .entete-t { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--ligne); }
  .tableau .entete-t h3 { margin: 0; font-size: 15px; flex: 1; }
  .tableau .entete-t input { width: 200px; padding: 5px 8px; border: 1px solid var(--ligne); border-radius: 8px; font: inherit; }
  .colonnes { flex: 1; display: grid; grid-template-columns: repeat(4, minmax(210px, 1fr)); gap: 10px; padding: 10px; overflow: auto; min-height: 0; background: var(--fond); }
  .colonne { background: #efede8; border-radius: 10px; display: flex; flex-direction: column; min-height: 0; }
  .colonne.cible { outline: 2px dashed var(--accent); outline-offset: -2px; }
  .colonne > h4 { margin: 0; padding: 9px 12px; font-size: 12.5px; display: flex; gap: 6px; align-items: center; border-bottom: 3px solid; border-radius: 10px 10px 0 0; }
  .colonne > h4 span { margin-left: auto; color: var(--doux); font-weight: 400; }
  .colonne > h4 button { font-size: 11px; padding: 1px 7px; border-radius: 10px; font-weight: 400; }
  .colonne .cartes { overflow: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
  .fiche { background: var(--panneau); border-radius: 8px; padding: 9px 10px; border: 1px solid var(--ligne); cursor: pointer; font-size: 12.5px; }
  .fiche:hover { border-color: var(--accent); }
  .fiche.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--sel); }
  .fiche .l1 { display: flex; gap: 6px; align-items: baseline; margin-bottom: 3px; }
  .fiche .l1 b { flex: 1; font-size: 13px; }
  .fiche .age { color: var(--doux); font-size: 11.5px; white-space: nowrap; }
  .fiche .age.vieux { color: #c0392b; font-weight: 600; }
  .fiche .typ { display: inline-block; font-size: 10.5px; border-radius: 5px; padding: 0 5px; margin-bottom: 4px; color: #fff; }
  .fiche .obj { color: var(--doux); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
  .fiche .q { background: #fdecea; color: #8e2a1f; border-radius: 6px; padding: 4px 6px; margin-top: 5px; }
  .fiche .act { margin-top: 4px; color: #23221f; }
  .fiche .man { font-size: 10.5px; color: var(--doux); display: flex; align-items: center; gap: 6px; margin-top: 4px; }
  .fiche .man span { flex: 1; }
  .fiche .clore { font-size: 11px; padding: 1px 7px; border-radius: 10px; }
  .fiche .clore:hover { background: #3f8f4f; color: #fff; border-color: #3f8f4f; }
  /* Sélecteur de dossiers Drive */
  #classeur { position: fixed; inset: 0; background: rgba(20,20,18,.35); display: flex; align-items: center; justify-content: center; z-index: 10; }
  #classeur .boite { background: var(--panneau); width: min(880px, 94vw); height: min(620px, 90vh); border-radius: 12px; display: flex; flex-direction: column; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
  #classeur .haut { padding: 14px 18px 8px; border-bottom: 1px solid var(--ligne); }
  #classeur .haut h3 { margin: 0 0 8px; font-size: 15px; }
  #classeur .comptes { display: flex; gap: 6px; flex-wrap: wrap; }
  #classeur .comptes button.actif { background: var(--sel); border-color: var(--accent); font-weight: 600; }
  #classeur .milieu { flex: 1; display: grid; grid-template-columns: 200px 1fr; min-height: 0; }
  #classeur .recents { border-right: 1px solid var(--ligne); overflow: auto; padding: 10px 0; background: #fbfaf8; }
  #classeur .recents h4 { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--doux); margin: 4px 14px; }
  #classeur .recents div { padding: 5px 14px; cursor: pointer; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #classeur .recents div:hover { background: var(--survol); }
  #classeur .zone { display: flex; flex-direction: column; min-height: 0; }
  #classeur .outils { display: flex; gap: 8px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--ligne); }
  #classeur .fil { flex: 1; font-size: 13px; color: var(--doux); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #classeur .fil a { color: var(--accent); cursor: pointer; text-decoration: none; }
  #classeur .outils input { width: 200px; padding: 5px 8px; border: 1px solid var(--ligne); border-radius: 8px; font: inherit; }
  #classeur .grille { flex: 1; overflow: auto; padding: 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; align-content: start; }
  #classeur .dossier { border: 1px solid var(--ligne); border-radius: 10px; padding: 12px 10px 10px; cursor: pointer; text-align: center; font-size: 12.5px; position: relative; }
  #classeur .dossier:hover { background: var(--survol); border-color: var(--accent); }
  #classeur .dossier svg { width: 54px; height: 44px; display: block; margin: 0 auto 6px; }
  #classeur .dossier span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #classeur .dossier i { position: absolute; top: 8px; right: 8px; width: 9px; height: 9px; border-radius: 50%; }
  #classeur .bas { display: flex; gap: 8px; align-items: center; padding: 10px 18px; border-top: 1px solid var(--ligne); }
  #classeur .bas .meta { flex: 1; margin: 0; }
  #lecture { display: block; }
</style>
</head>
<body>
<header>
  <img src="icone.svg" alt="" width="26" height="26" style="border-radius:6px">
  <h1>Courrier</h1>
  <input type="search" id="recherche" placeholder="Rechercher (syntaxe Gmail)" hidden>
  <span class="esp"></span>
  <select id="fichiers" hidden title="Fichiers de suivi alimentés par Courrier"><option value="">Fichiers de suivi…</option></select>
  <span id="qui" class="meta" style="margin:0"></span>
  <button id="ajout" hidden title="Connecter un autre compte Gmail">+ Compte</button>
  <button id="sortie" hidden>Déconnexion</button>
</header>

<div id="accueil">
  <p>Connectez votre compte Gmail pour commencer.</p>
  <button class="principal" id="connexion">Se connecter avec Google</button>
</div>

<main id="app" hidden>
  <nav id="nav"></nav>
  <section id="liste"></section>
  <section id="lecture"><div class="vide">Sélectionnez une conversation.</div></section>
</main>
<div id="toast"></div>

<script>
const API = "https://gcghlwjuekhbueljpldk.supabase.co/functions/v1";
const RETOUR = location.origin + location.pathname;
const $ = (s) => document.querySelector(s);
const dec = (s) => { const t = document.createElement("textarea"); t.innerHTML = s ?? ""; return t.value; };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const memo = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch { return null; } };

// Couleur de la « casquette » selon l'adresse de réception
const IDENTITES = [
  [/ecole-edm\.fr|ecole\.transitions|design-mutation/i, "EDM", "#2f6fb3"],
  [/manuel\.zacklad\.cnam@gmail/i, "Recrutement", "#3f8f4f"],
  [/lecnam\.net|cnam\.fr/i, "CNAM", "#b3442f"],
  [/zacklad\.org|manuel\.experience|zacklad@gmail|pluriverse/i, "Perso", "#7a5bb3"],
];
function identite(dest) {
  for (const [re, nom, coul] of IDENTITES) if (re.test(dest || "")) return { nom, coul };
  return null;
}

// Dossiers Gmail affichés pour chaque compte
const DOSSIERS = [
  ["Boîte de réception", "INBOX"],
  ["Messages suivis", "is:starred"],
  ["En attente", "in:snoozed"],
  ["Important", "is:important"],
  ["Messages envoyés", "in:sent"],
  ["Brouillons", "in:draft"],
  ["Tous les messages", "in:anywhere -in:spam -in:trash"],
];
// Onglets de la boîte de réception, comme dans Gmail
const ONGLETS = [
  ["Principale", "primary", "#1d55d6"],
  ["Promotions", "promotions", "#2f8f4f"],
  ["Réseaux sociaux", "social", "#2f6fb3"],
  ["Notifications", "updates", "#e8710a"],
  ["Forums", "forums", "#7a5bb3"],
];

let etat = { session: null, moi: null, vue: null, messages: [], pageToken: null, sel: null, compteurs: {} };

function toast(t) { const e = $("#toast"); e.textContent = t; e.classList.add("vu"); setTimeout(() => e.classList.remove("vu"), 2200); }

async function api(action, corps = {}) {
  const r = await fetch(`${API}/api`, {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-session": etat.session },
    body: JSON.stringify({ action, ...corps }),
  });
  const d = await r.json();
  if (r.status === 401) { deconnecter(false); throw new Error("Session expirée"); }
  if (d.erreur) throw new Error(d.erreur);
  return d;
}

function connecter(extra = "") {
  location.href = `${API}/oauth-start?retour=${encodeURIComponent(RETOUR)}${extra}`;
}

function deconnecter(serveur = true) {
  if (serveur && etat.session) api("deconnexion").catch(() => {});
  try { localStorage.removeItem("courrier.session"); } catch {}
  etat.session = null;
  $("#app").hidden = true; $("#accueil").hidden = false;
  $("#ajout").hidden = $("#sortie").hidden = $("#recherche").hidden = true;
  $("#qui").textContent = "";
}

async function demarrer() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("erreur")) {
    history.replaceState(null, "", location.pathname);
    $("#accueil").insertAdjacentHTML("afterbegin", `<p style="color:#b3442f;max-width:560px;text-align:center">${esc(h.get("erreur"))}</p>`);
  }
  if (h.get("dropbox")) {
    history.replaceState(null, "", location.pathname);
    setTimeout(() => toast("Dropbox connectée : elle apparaît dans le classeur"), 800);
  }
  if (h.get("session")) {
    memo("courrier.session", h.get("session"));
    history.replaceState(null, "", location.pathname);
  }
  etat.session = h.get("session") || memo("courrier.session");
  if (!etat.session) return;
  try { etat.moi = await api("moi"); } catch { return; }
  $("#accueil").hidden = true; $("#app").hidden = false;
  $("#ajout").hidden = $("#sortie").hidden = $("#recherche").hidden = false;
  chargerFichiers();
  $("#qui").textContent = etat.moi.comptes.filter((c) => c.role !== "drive").map((c) => c.email).join(" · ");
  dessinerNav();
  const principal = etat.moi.comptes.find((c) => c.role === "principal") || etat.moi.comptes[0];
  ouvrirDossier(principal.email, "INBOX");
}

// ---------- Fichiers de suivi (menu déroulant de l'en-tête) ----------
async function chargerFichiers() {
  try {
    const { fichiers } = await api("fichiers");
    const sel = $("#fichiers");
    sel.innerHTML = `<option value="">Fichiers de suivi…</option>` + fichiers.map((f) => `<option value="${esc(f.url)}">${esc(f.nom)}</option>`).join("");
    sel.hidden = !fichiers.length;
    sel.onchange = () => { if (sel.value) window.open(sel.value, "_blank", "noopener"); sel.value = ""; };
  } catch {}
}

// ---------- Navigation ----------
function dessinerNav() {
  const { comptes, processus, compteurs } = etat.moi;
  let h = "";
  // Chaque section (boîte mail ou casquette) est un « classeur » repliable ; l'état est mémorisé.
  const classeur = (cle, titre, contenu, alerte = 0) => {
    const replie = memo(`courrier.replie.${cle}`) === "1";
    return `<h2 class="classeur${replie ? " replie" : ""}" data-classeur="${esc(cle)}"><span class="chev">▾</span>${titre}${alerte ? `<span class="nbc alerte">${alerte}</span>` : ""}</h2>`
      + `<div class="contenu-classeur" data-contenu="${esc(cle)}" ${replie ? "hidden" : ""}>${contenu}</div>`;
  };
  const suivis = etat.moi.suivis ?? [];
  const boite = (c) => {
    const id = identite(c.email);
    const liste = c.role === "recrutement" ? DOSSIERS.filter(([, q]) => ["INBOX", "in:sent", "is:starred"].includes(q)) : DOSSIERS;
    return classeur(c.email, esc(c.role === "recrutement" ? "Recrutement · " : "") + esc(c.email), liste.map(([nom, q]) =>
      `<div class="entree" data-boite="${esc(c.email)}" data-q="${esc(q)}"><span class="pastille" style="background:${q === "INBOX" ? (id?.coul ?? "#999") : "transparent"}"></span>${esc(nom)}</div>`).join(""));
  };
  // Boîtes principales en tête ; la boîte « recrutement » vient juste sous la rubrique Recrutement.
  for (const c of comptes.filter((x) => x.role !== "drive" && x.role !== "recrutement")) h += boite(c);
  const boitesRecrutement = comptes.filter((x) => x.role === "recrutement").map(boite).join("");
  const parCasquette = {};
  for (const p of processus) (parCasquette[p.casquette] ??= []).push(p);
  for (const [cas, liste] of Object.entries(parCasquette)) {
    let alerte = 0;
    const contenu = liste.map((p) => {
      const s = suivis.find((x) => x.processus_id === p.id);
      if (s) alerte += s.a_traiter;
      const badge = s ? (s.a_traiter ? `<span class="nb"><span class="alerte" title="Dossiers à traiter">${s.a_traiter}</span></span>` : `<span class="nb">▦</span>`) : `<span class="nb">${compteurs[p.id] ?? ""}</span>`;
      return `<div class="entree" data-processus="${p.id}" ${s ? `data-suivi="${esc(s.id)}"` : ""}><span class="pastille" style="background:${esc(p.couleur || "#999")}"></span>${esc(p.nom)}${badge}</div>`;
    }).join("");
    h += classeur("cas:" + cas, esc(cas), contenu, alerte);
    if (cas === "Recrutement") h += boitesRecrutement;
  }
  if (!parCasquette.Recrutement) h += boitesRecrutement;
  $("#nav").innerHTML = h;
  for (const t of document.querySelectorAll("[data-classeur]")) t.onclick = () => {
    const cont = document.querySelector(`[data-contenu="${CSS.escape(t.dataset.classeur)}"]`);
    cont.hidden = !cont.hidden; t.classList.toggle("replie", cont.hidden);
    memo(`courrier.replie.${t.dataset.classeur}`, cont.hidden ? "1" : "0");
  };
  for (const e of document.querySelectorAll("[data-boite]")) e.onclick = () => ouvrirDossier(e.dataset.boite, e.dataset.q);
  for (const e of document.querySelectorAll("[data-processus]")) {
    e.onclick = () => e.dataset.suivi ? ouvrirSuivi(e.dataset.suivi, e.dataset.processus) : ouvrirProcessus(e.dataset.processus);
    e.ondragover = (ev) => { ev.preventDefault(); e.classList.add("cible"); };
    e.ondragleave = () => e.classList.remove("cible");
    e.ondrop = async (ev) => {
      ev.preventDefault(); e.classList.remove("cible");
      await classer(JSON.parse(ev.dataTransfer.getData("text/plain")), e.dataset.processus);
    };
  }
  marquerNav();
}

function marquerNav() {
  for (const e of document.querySelectorAll(".entree")) {
    const actif = (etat.vue?.boite && e.dataset.boite === etat.vue.boite && e.dataset.q === etat.vue.dossier) ||
      (etat.vue?.processus && e.dataset.processus === etat.vue.processus);
    e.classList.toggle("actif", !!actif);
  }
}

// ---------- Listes ----------
function requete() {
  const v = etat.vue;
  if (v.recherche) return v.recherche;
  if (v.dossier === "INBOX") return `in:inbox category:${v.onglet}`;
  return v.dossier;
}

async function ouvrirDossier(email, dossier, recherche) {
  etat.vue = { boite: email, dossier, onglet: memo("courrier.onglet") || "primary", recherche };
  $("#app").classList.remove("kanban", "ouvert");
  etat.sel = null;
  viderLecture();
  marquerNav();
  await chargerListe();
  if (dossier === "INBOX" && !recherche) {
    api("compteurs_onglets", { compte: email }).then((c) => { etat.compteurs = c; dessinerListe(); }).catch(() => {});
  }
}

async function chargerListe() {
  $("#liste").innerHTML = barre() + `<div class="vide">Chargement…</div>`;
  brancherBarre();
  try {
    const d = await api("fils", { compte: etat.vue.boite, q: requete() });
    etat.messages = d.messages.map((m) => ({ ...m, compte: etat.vue.boite }));
    etat.pageToken = d.pageToken;
    dessinerListe();
  } catch (e) { $("#liste").innerHTML = barre() + `<div class="vide">${esc(e.message)}</div>`; brancherBarre(); }
}

async function plus() {
  const d = await api("fils", { compte: etat.vue.boite, q: requete(), pageToken: etat.pageToken });
  etat.messages.push(...d.messages.map((m) => ({ ...m, compte: etat.vue.boite })));
  etat.pageToken = d.pageToken;
  dessinerListe();
}

// Vide le volet de lecture quand on change de dossier, d'onglet ou de rubrique.
function viderLecture(texte = "Sélectionnez une conversation.") {
  $("#lecture").innerHTML = `<div class="vide">${esc(texte)}</div>`;
}

async function ouvrirProcessus(id) {
  etat.vue = { processus: id };
  $("#app").classList.remove("kanban", "ouvert");
  etat.sel = null;
  viderLecture("Chargement…");
  marquerNav();
  $("#liste").innerHTML = `<div class="vide">Chargement…</div>`;
  const d = await api("processus_messages", { processus_id: id });
  etat.messages = d.messages.map((m) => ({ ...m, compte: m.compte_email, participants: [nomExp(m.expediteur)], nb: 1 }));
  etat.pageToken = null;
  dessinerListe();
  // Dans une rubrique, on affiche directement le message le plus récent.
  if (etat.messages.length) lire(etat.messages[0]); else viderLecture("Aucun message dans cette rubrique.");
}

function barre() {
  const v = etat.vue;
  if (!v?.boite || v.dossier !== "INBOX" || v.recherche) return "";
  return `<div class="onglets">${ONGLETS.map(([nom, cat, coul]) => {
    const n = etat.compteurs[cat];
    const badge = n && cat !== "primary" ? `<span class="badge" style="background:${coul}">${n >= 100 ? "99+" : n} nouveaux</span>` : "";
    return `<button data-onglet="${cat}" class="${v.onglet === cat ? "actif" : ""}">${esc(nom)}${badge}</button>`;
  }).join("")}</div>`;
}

function brancherBarre() {
  for (const b of document.querySelectorAll(".onglets button")) b.onclick = () => {
    memo("courrier.onglet", b.dataset.onglet);
    etat.vue.onglet = b.dataset.onglet;
    etat.sel = null; viderLecture();
    chargerListe();
  };
}

function nomProc(id) { return etat.moi.processus.find((p) => p.id === id); }

function dateCourte(iso) {
  const d = new Date(iso), auj = new Date();
  return d.toDateString() === auj.toDateString()
    ? d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })
    : d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
}

function nomExp(de) { return (de || "").replace(/<.*>/, "").replace(/"/g, "").trim() || de; }

function dessinerListe() {
  if (!etat.messages.length) { $("#liste").innerHTML = barre() + `<div class="vide">Aucun message.</div>`; brancherBarre(); return; }
  $("#liste").innerHTML = barre() + etat.messages.map((m, i) => {
    const id = identite(m.destinataires);
    const p = m.processus_id && nomProc(m.processus_id);
    const qui = (m.participants?.length ? m.participants.slice(0, 3).join(", ") : nomExp(m.expediteur));
    return `<div class="msg ${m.non_lu ? "nonlu" : ""} ${etat.sel === m.thread_id ? "sel" : ""}" draggable="true" data-i="${i}">
      <div class="l1">${m.suivi !== undefined ? `<span class="etoile ${m.suivi ? "oui" : ""}" data-etoile="${i}" title="Suivre">${m.suivi ? "★" : "☆"}</span>` : ""}<span class="de">${m.important ? `<span class="imp" title="Important">▶</span>` : ""}${esc(qui)}${m.nb > 1 ? `<span class="nbfil">${m.nb}</span>` : ""}</span><span class="date">${dateCourte(m.date)}</span></div>
      <div class="obj">${id ? `<span class="etiq" style="background:${id.coul}">${id.nom}</span>` : ""}${p ? `<span class="etiq" style="background:${esc(p.couleur)}">${esc(p.nom)}</span>` : ""}${esc(m.objet || "(sans objet)")}</div>
      <div class="ext">${esc(dec(m.extrait))}</div></div>`;
  }).join("") + (etat.pageToken ? `<div class="plus"><button id="btnplus">Plus de conversations</button></div>` : "");
  for (const e of document.querySelectorAll(".msg")) {
    const m = etat.messages[e.dataset.i];
    e.onclick = (ev) => { if (!ev.target.dataset.etoile) lire(m); };
    e.ondragstart = (ev) => ev.dataTransfer.setData("text/plain", JSON.stringify({ id: m.id, compte: m.compte, thread_id: m.thread_id }));
  }
  for (const e of document.querySelectorAll("[data-etoile]")) e.onclick = async (ev) => {
    ev.stopPropagation();
    const m = etat.messages[e.dataset.etoile];
    m.suivi = !m.suivi; dessinerListe();
    api("suivre", { compte: m.compte, thread_id: m.thread_id, oui: m.suivi }).catch((er) => toast(er.message));
  };
  if ($("#btnplus")) $("#btnplus").onclick = plus;
  brancherBarre();
}

// ---------- Lecture d'une conversation ----------
function lireFil(m) { return lire(m, true); }
async function lire(m, depuisTableau = false) {
  etat.sel = m.thread_id;
  if (!depuisTableau && !etat.vue?.suivi) dessinerListe();
  const zone = $("#lecture");
  zone.innerHTML = `<div class="vide">Chargement…</div>`;
  try {
    const d = await api("fil", { compte: m.compte, thread_id: m.thread_id });
    const dernierIdx = d.messages.length - 1;
    const opts = `<option value="">Classer dans…</option>` + etat.moi.processus.map((p) =>
      `<option value="${p.id}" ${p.id === m.processus_id ? "selected" : ""}>${esc(p.casquette)} / ${esc(p.nom)}</option>`).join("");
    zone.innerHTML = `
      <h2>${esc(d.messages[0]?.objet || "(sans objet)")}</h2>
      <div class="barre"><select id="classer">${opts}</select>
        <a href="https://mail.google.com/mail/?authuser=${encodeURIComponent(m.compte)}#all/${d.thread_id}" target="_blank" rel="noopener"><button>Ouvrir dans Gmail</button></a>
        <a href="https://links.mimestream.com/g/${encodeURIComponent(m.compte)}/m/${(d.messages.filter((x) => !x.brouillon).pop() ?? d.messages[0]).id}" target="_blank" rel="noopener"><button>Ouvrir dans Mimestream</button></a>
        <button id="b-repondre">↩ Répondre</button><button id="b-tous">↩ Répondre à tous</button>${d.messages.length > 1 ? `<button id="b-deplier">Tout déplier</button>` : ""}</div>
      ${d.messages.map((x, i) => `
        <div class="carte${x.brouillon ? " brouillon" : ""}" data-c="${i}">
          <div class="tete" title="Cliquer pour ouvrir ou refermer ce message"><span class="chev-m">▸</span>${x.brouillon ? `<span class="tag">Brouillon</span>` : ""}<b>${esc(nomExp(x.expediteur))}</b><span class="ex">${i === dernierIdx ? esc("À " + x.destinataires) : esc(dec(x.extrait))}</span><span class="dt">${new Date(x.date).toLocaleString("fr-FR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}</span>${x.brouillon ? "" : `<button class="rep-tete" data-rep="${i}" title="Répondre à ce message">↩</button>`}</div>
          <div class="corps" ${i === dernierIdx || x.brouillon ? "" : "hidden"}>
            ${x.brouillon ? `<div class="meta">À ${esc(x.destinataires)}</div>` : ""}
            ${x.cc ? `<div class="meta">Cc ${esc(x.cc)}</div>` : ""}
            ${x.pieces_jointes.length ? `<div class="pj">${x.pieces_jointes.map((p, k) => x.brouillon
              ? `<span>📎 ${esc(p.nom)}</span>`
              : `<button data-ranger="${i}:${k}" title="Ranger cette pièce jointe dans Drive">📎 ${esc(p.nom)} · Ranger dans Drive…</button>`).join("")}</div>` : ""}
            <iframe sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin" data-f="${i}"></iframe>
            ${x.brouillon ? "" : `<div class="rep-msg"><button data-rep="${i}">↩ Répondre à ce message</button><button data-reptous="${i}">↩ Répondre à tous</button></div>`}
            ${x.brouillon && x.draft_id ? `<div class="actions-brouillon">
              <button class="principal" data-envoyer="${esc(x.draft_id)}">Envoyer ce brouillon</button>
              <a href="https://links.mimestream.com/g/${encodeURIComponent(m.compte)}/m/${x.id}" target="_blank" rel="noopener"><button>Modifier dans Mimestream</button></a>
              <select data-signature="${esc(x.draft_id)}" title="Signature du brouillon">
                <option value="">Signature…</option>
                ${(etat.moi.signatures ?? []).map((g) => `<option value="${g.id}">${esc(g.nom)}</option>`).join("")}
                <option value="aucune">Aucune signature</option>
              </select>
              <button data-supprimer="${esc(x.draft_id)}" style="margin-left:auto">Supprimer ce brouillon</button>
            </div>` : ""}
          </div>
        </div>`).join("")}`;
    d.messages.forEach((x, i) => {
      const f = zone.querySelector(`iframe[data-f="${i}"]`);
      const html = x.html || `<pre style="white-space:pre-wrap;font:14px/1.5 sans-serif">${esc(x.texte)}</pre>`;
      f.onload = () => { try { f.style.height = (f.contentDocument.body.scrollHeight + 24) + "px"; } catch {} };
      f.srcdoc = `<base target="_blank"><style>body{font:14px/1.5 sans-serif;margin:8px;word-wrap:break-word}img{max-width:100%;height:auto}</style>${html}`;
    });
    const basculer = (c, ouvrir) => {
      const corps = c.nextElementSibling; corps.hidden = ouvrir === undefined ? !corps.hidden : !ouvrir;
      c.classList.toggle("ouvert", !corps.hidden);
      const f = corps.querySelector("iframe"); if (!corps.hidden && f?.onload) f.onload();
    };
    for (const c of zone.querySelectorAll(".carte .tete")) {
      c.classList.toggle("ouvert", !c.nextElementSibling.hidden);
      c.onclick = (ev) => { if (!ev.target.closest("button")) basculer(c); };
    }
    if ($("#b-deplier")) $("#b-deplier").onclick = (ev) => {
      const tout = ev.target.textContent === "Tout déplier";
      for (const c of zone.querySelectorAll(".carte .tete")) basculer(c, tout);
      ev.target.textContent = tout ? "Tout replier" : "Tout déplier";
    };
    $("#classer").onchange = (ev) => ev.target.value && classer(m, ev.target.value);
    for (const b of zone.querySelectorAll("[data-ranger]")) b.onclick = () => {
      const [i, k] = b.dataset.ranger.split(":").map(Number);
      ouvrirClasseur(m.compte, d.messages[i], d.messages[i].pieces_jointes[k]);
    };
    for (const sel of zone.querySelectorAll("[data-signature]")) sel.onchange = async () => {
      if (!sel.value) return;
      sel.disabled = true;
      try {
        await api("changer_signature", { compte: m.compte, draft_id: sel.dataset.signature, signature_id: sel.value === "aucune" ? null : sel.value });
        toast(sel.value === "aucune" ? "Signature retirée" : "Signature changée"); lire(m);
      } catch (er) { toast(er.message); sel.disabled = false; sel.value = ""; }
    };
    for (const b of zone.querySelectorAll("[data-supprimer]")) b.onclick = async () => {
      if (!confirm("Supprimer définitivement ce brouillon ?")) return;
      b.disabled = true;
      try { await api("supprimer_brouillon", { compte: m.compte, draft_id: b.dataset.supprimer }); toast("Brouillon supprimé"); lire(m); }
      catch (er) { toast(er.message); b.disabled = false; }
    };
    for (const b of zone.querySelectorAll("[data-envoyer]")) b.onclick = async () => {
      const x = d.messages.find((y) => y.draft_id === b.dataset.envoyer);
      if (!confirm(`Envoyer ce brouillon à ${x?.destinataires || "son destinataire"}${x?.cc ? " (copie : " + x.cc + ")" : ""} ?`)) return;
      b.disabled = true; b.textContent = "Envoi…";
      try { await api("envoyer_brouillon", { compte: m.compte, draft_id: b.dataset.envoyer }); toast("Message envoyé"); lire(m); }
      catch (er) { toast(er.message); b.disabled = false; b.textContent = "Envoyer ce brouillon"; }
    };
    if ($("#app").classList.contains("kanban")) {
      zone.insertAdjacentHTML("afterbegin", `<button class="fermer-l" title="Fermer (Échap)">✕ Fermer</button>`);
      zone.querySelector(".fermer-l").onclick = fermerLectureKanban;
    }
    const aRepondre = d.messages.filter((x) => !x.brouillon).pop();
    $("#b-repondre").onclick = () => ouvrirReponse(m, aRepondre, false);
    $("#b-tous").onclick = () => ouvrirReponse(m, aRepondre, true);
    for (const b of zone.querySelectorAll("[data-rep]")) b.onclick = (ev) => { ev.stopPropagation(); ouvrirReponse(m, d.messages[b.dataset.rep], false); };
    for (const b of zone.querySelectorAll("[data-reptous]")) b.onclick = () => ouvrirReponse(m, d.messages[b.dataset.reptous], true);
    if (m.non_lu) { api("fil_lu", { compte: m.compte, thread_id: m.thread_id }).catch(() => {}); m.non_lu = false; dessinerListe(); }
  } catch (e) { zone.innerHTML = `<div class="vide">${esc(e.message)}</div>`; }
}

// ---------- Réponse rédigée dans Courrier ----------
async function ouvrirReponse(m, msg, tous) {
  if (!msg) return;
  $("#redaction")?.remove();
  const zone = $("#lecture");
  const sigs = etat.moi.signatures ?? [];
  let sigDefaut = ""; try { sigDefaut = localStorage.getItem("courrier.signature") ?? ""; } catch {}
  if (sigDefaut && sigDefaut !== "aucune" && !sigs.some((g) => g.id === sigDefaut)) sigDefaut = "";
  zone.insertAdjacentHTML("beforeend", `<div id="redaction" class="carte">
    <div class="corps" style="padding-top:10px">
      <div class="meta">En réponse au message de <b>${esc(nomExp(msg.expediteur))}</b> du ${new Date(msg.date).toLocaleString("fr-FR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}</div>
      <div class="champs-r" id="r-dest">Préparation…</div>
      <textarea id="r-texte" rows="9" placeholder="Votre réponse…"></textarea>
      <div class="actions-brouillon">
        <select id="r-sig" title="Signature">${sigs.map((g) => `<option value="${g.id}" ${g.id === sigDefaut ? "selected" : ""}>Signature : ${esc(g.nom)}</option>`).join("")}<option value="aucune" ${sigDefaut === "aucune" ? "selected" : ""}>Sans signature</option></select>
        <button class="principal" id="r-envoyer" disabled>Envoyer</button>
        <button id="r-brouillon" disabled>Enregistrer en brouillon</button>
        <button id="r-annuler" style="margin-left:auto">Annuler</button>
      </div>
    </div></div>`);
  const r = $("#redaction");
  r.scrollIntoView({ behavior: "smooth", block: "end" });
  $("#r-texte").focus();
  $("#r-annuler").onclick = () => { if (!$("#r-texte").value.trim() || confirm("Abandonner cette réponse ?")) r.remove(); };
  $("#r-sig").onchange = (ev) => { try { localStorage.setItem("courrier.signature", ev.target.value); } catch {} };
  const base = { compte: m.compte, message_id: msg.id, tous };
  let ap;
  try {
    ap = await api("repondre", { ...base, apercu: true });
    $("#r-dest").innerHTML = `<label>De</label><span>${esc(ap.de)}</span>
      <label for="r-a">À</label><input id="r-a" value="${esc(ap.a)}">
      <label for="r-cc">Cc</label><input id="r-cc" value="${esc(ap.cc)}" placeholder="(aucun)">
      <label>Objet</label><span>${esc(ap.objet)}</span>`;
    $("#r-envoyer").disabled = $("#r-brouillon").disabled = false;
  } catch (e) { $("#r-dest").textContent = e.message; return; }
  const partir = async (envoyer) => {
    const texte = $("#r-texte").value.trim();
    if (!texte) return toast("Le message est vide.");
    const a = $("#r-a").value.trim(), cc = $("#r-cc").value.trim();
    if (!a) return toast("Indiquez au moins un destinataire.");
    if (envoyer && !confirm(`Envoyer cette réponse à ${a}${cc ? " (copie : " + cc + ")" : ""} ?`)) return;
    const sig = $("#r-sig").value;
    for (const b of r.querySelectorAll("button")) b.disabled = true;
    try {
      await api("repondre", { ...base, texte, envoyer, a, cc, signature_id: sig && sig !== "aucune" ? sig : null });
      toast(envoyer ? "Réponse envoyée" : "Brouillon enregistré");
      await lire(m, true);
    } catch (e) { toast(e.message); for (const b of r.querySelectorAll("button")) b.disabled = false; }
  };
  $("#r-envoyer").onclick = () => partir(true);
  $("#r-brouillon").onclick = () => partir(false);
}

// ---------- Tableau de suivi (Kanban) d'un flux d'échanges ----------
const COLONNES = [
  ["a_traiter", "À traiter par moi", "#c0392b"],
  ["attente_efficience", "En attente d'Efficience Paie", "#e8a33d"],
  ["attente_salarie", "En attente d'un salarié", "#7a5bb3"],
  ["clos", "Clos", "#3f8f4f"],
];
const COUL_TYPE = { "Déclaration nouveau salarié": "#2f6fb3", "Contrat": "#1f8a8a", "Paie du mois": "#3f8f4f",
  "Demande d'un salarié": "#7a5bb3", "Administratif": "#8a6d3b", "Autre": "#8a8578" };

async function ouvrirSuivi(flux, processusId) {
  etat.vue = { suivi: flux, processus: processusId, filtre: "" };
  etat.sel = null;
  $("#app").classList.add("kanban");
  $("#app").classList.remove("ouvert");
  marquerNav();
  viderLecture("Cliquez sur une carte pour ouvrir la conversation.");
  $("#liste").innerHTML = `<div class="vide">Chargement du tableau…</div>`;
  try {
    const d = await api("suivi_liste", { flux });
    etat.fils = d.fils;
    dessinerTableau();
  } catch (e) { $("#liste").innerHTML = `<div class="vide">${esc(e.message)}</div>`; }
}

function fermerLectureKanban() {
  $("#app").classList.remove("ouvert"); etat.sel = null;
  for (const o of document.querySelectorAll(".fiche.sel")) o.classList.remove("sel");
}
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && !$("#classeur") && $("#app").classList.contains("ouvert")) fermerLectureKanban(); });

function age(dateIso) {
  const j = Math.floor((Date.now() - new Date(dateIso).getTime()) / 86400000);
  return { j, txt: j === 0 ? "aujourd'hui" : j === 1 ? "hier" : `il y a ${j} j` };
}

function dessinerTableau() {
  const v = etat.vue, s = (etat.moi.suivis ?? []).find((x) => x.id === v.suivi);
  const f = (v.filtre || "").toLowerCase();
  const visibles = etat.fils.filter((x) => !f || [x.objet, x.personne, x.resume, x.action, x.type].join(" ").toLowerCase().includes(f));
  const limiteClos = Date.now() - 30 * 86400000;
  $("#liste").innerHTML = `<div class="tableau">
    <div class="entete-t"><h3>${esc(s?.nom ?? "Suivi")}</h3><input type="search" id="filtre-t" placeholder="Filtrer (nom, type…)" value="${esc(v.filtre)}"><button id="maj-t" title="Recharger">↻</button></div>
    <div class="colonnes">${COLONNES.map(([cle, nom, coul]) => {
      const cartes = visibles.filter((x) => x.etat === cle && (cle !== "clos" || new Date(x.dernier_message_at).getTime() > limiteClos));
      return `<div class="colonne" data-col="${cle}"><h4 style="border-color:${coul}">${esc(nom)}<span>${cartes.length}</span>${cle === "clos" ? `<button id="purger-t" title="Supprimer du tableau les cartes closes de plus de 30 jours">Purger</button>` : ""}</h4><div class="cartes">${cartes.map((x) => {
        const a = age(x.dernier_message_at);
        return `<div class="fiche${x.thread_id === etat.sel ? " sel" : ""}" draggable="true" data-fil="${esc(x.thread_id)}">
          <div class="l1"><b>${esc(x.personne || x.objet || "(sans objet)")}</b><span class="age${cle !== "clos" && a.j >= 7 ? " vieux" : ""}">${a.txt}</span></div>
          ${x.type ? `<span class="typ" style="background:${COUL_TYPE[x.type] ?? "#8a8578"}">${esc(x.type)}</span>` : ""}
          ${x.personne ? `<div class="obj">${esc(x.objet || "")}</div>` : ""}
          <div>${esc(x.resume || x.extrait || "")}</div>
          ${cle === "a_traiter" && x.question ? `<div class="q">❓ ${esc(x.question)}</div>` : ""}
          ${cle !== "clos" && x.action ? `<div class="act">→ ${esc(x.action)}</div>` : ""}
          <div class="man"><span>${esc(x.dernier_expediteur || "")}${x.manuel ? " · placé à la main" : ""}</span>${cle !== "clos" ? `<button class="clore" title="Marquer comme traité">✓ Clore</button>` : ""}</div>
        </div>`;
      }).join("") || `<div class="vide" style="padding:14px">Rien ici.</div>`}</div></div>`;
    }).join("")}</div></div>`;
  let minuterie;
  $("#filtre-t").oninput = (ev) => { clearTimeout(minuterie); minuterie = setTimeout(() => { etat.vue.filtre = ev.target.value; dessinerTableau(); $("#filtre-t").focus(); }, 250); };
  $("#maj-t").onclick = () => ouvrirSuivi(v.suivi, v.processus);
  $("#purger-t").onclick = async () => {
    const n = etat.fils.filter((x) => x.etat === "clos" && new Date(x.dernier_message_at).getTime() < limiteClos).length;
    if (!n) return toast("Aucune carte close de plus de 30 jours.");
    if (!confirm(`Supprimer du tableau ${n} carte${n > 1 ? "s" : ""} close${n > 1 ? "s" : ""} de plus de 30 jours ? Les mails eux-mêmes ne sont pas touchés.`)) return;
    try { const d = await api("suivi_purger", { flux: v.suivi }); toast(`${d.supprimees} carte(s) purgée(s)`); ouvrirSuivi(v.suivi, v.processus); }
    catch (e) { toast(e.message); }
  };
  for (const c of document.querySelectorAll(".fiche")) {
    c.onclick = () => {
      const x = etat.fils.find((y) => y.thread_id === c.dataset.fil);
      etat.sel = x.thread_id;
      for (const o of document.querySelectorAll(".fiche")) o.classList.toggle("sel", o === c);
      $("#app").classList.add("ouvert");
      lireFil({ compte: x.compte, thread_id: x.thread_id, id: x.dernier_message_id, processus_id: v.processus });
    };
    c.ondragstart = (ev) => ev.dataTransfer.setData("text/fil", c.dataset.fil);
  }
  for (const col of document.querySelectorAll(".colonne")) {
    col.ondragover = (ev) => { if (ev.dataTransfer.types.includes("text/fil")) { ev.preventDefault(); col.classList.add("cible"); } };
    col.ondragleave = () => col.classList.remove("cible");
    col.ondrop = async (ev) => {
      ev.preventDefault(); col.classList.remove("cible");
      const fil = ev.dataTransfer.getData("text/fil"), x = etat.fils.find((y) => y.thread_id === fil);
      deplacerCarte(x, col.dataset.col);
    };
  }
  for (const b of document.querySelectorAll(".fiche .clore")) {
    b.onclick = (ev) => { ev.stopPropagation(); deplacerCarte(etat.fils.find((y) => y.thread_id === b.closest(".fiche").dataset.fil), "clos"); };
  }
  async function deplacerCarte(x, cible) {
    if (!x || x.etat === cible) return;
    const avant = x.etat;
    x.etat = cible; x.manuel = true;
    if (cible === "clos" && new Date(x.dernier_message_at).getTime() <= limiteClos) x.dernier_message_at = new Date().toISOString();
    dessinerTableau();
    try { await api("suivi_deplacer", { flux: v.suivi, thread_id: x.thread_id, etat: cible }); etat.moi = await api("moi"); dessinerNav(); }
    catch (e) { x.etat = avant; dessinerTableau(); toast(e.message); }
  }
}

// ---------- Classeur : rangement d'une pièce jointe dans un dossier Drive ----------
const ICONE_DOSSIER = (c) => `<svg viewBox="0 0 54 44"><path d="M3 8a4 4 0 0 1 4-4h13l5 5h22a4 4 0 0 1 4 4v24a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4z" fill="${c}"/><path d="M3 15h48v22a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4z" fill="${c}" opacity=".82"/></svg>`;
let cl = null; // état du classeur ouvert

function ouvrirClasseur(compteMail, msg, pj) {
  const comptes = [
    ...etat.moi.comptes.filter((c) => c.role !== "recrutement").map((c) => ({ email: c.email, libelle: c.email })),
    ...(etat.moi.dropbox ?? []).map((d) => ({ email: "dropbox:" + d.email, libelle: "Dropbox · " + d.email })),
  ];
  cl = { compteMail, msg, pj, comptes, compte: comptes[0].email, chemin: [{ id: "root", nom: "Mon Drive" }], recherche: "" };
  document.body.insertAdjacentHTML("beforeend", `<div id="classeur"><div class="boite">
    <div class="haut"><h3>Ranger « ${esc(pj.nom)} » dans Drive</h3><div class="comptes"></div></div>
    <div class="milieu"><div class="recents"></div>
      <div class="zone"><div class="outils"><div class="fil"></div><button id="cl-nouveau" title="Créer un sous-dossier ici">+ Nouveau dossier</button><input type="search" placeholder="Rechercher un dossier"></div><div class="grille"></div></div></div>
    <div class="bas"><span class="meta"></span><button id="cl-annuler">Annuler</button><button class="principal" id="cl-ranger">Ranger ici</button></div>
  </div></div>`);
  const c = $("#classeur");
  c.onclick = (ev) => { if (ev.target === c) fermerClasseur(); };
  $("#cl-annuler").onclick = fermerClasseur;
  $("#cl-nouveau").onclick = async () => {
    const parent = cl.chemin[cl.chemin.length - 1];
    const nom = prompt(`Nom du nouveau dossier dans « ${parent.nom} » :`);
    if (!nom || !nom.trim()) return;
    try {
      const d = await api("creer_dossier", { compte: cl.compte, parent: parent.id, nom: nom.trim() });
      cl.chemin.push({ id: d.id, nom: d.name }); toast(`Dossier « ${d.name} » créé`); chargerClasseur();
    } catch (e) { toast(e.message); }
  };
  $("#cl-ranger").onclick = () => { const d = cl.chemin[cl.chemin.length - 1]; rangerIci(cl.compte, d.id, d.nom); };
  let minuterie;
  c.querySelector(".outils input").oninput = (ev) => { clearTimeout(minuterie); minuterie = setTimeout(() => { cl.recherche = ev.target.value.trim(); chargerClasseur(); }, 300); };
  document.addEventListener("keydown", echapClasseur);
  chargerClasseur();
}
function echapClasseur(ev) { if (ev.key === "Escape") fermerClasseur(); }
function fermerClasseur() { $("#classeur")?.remove(); document.removeEventListener("keydown", echapClasseur); cl = null; }

async function chargerClasseur() {
  const c = $("#classeur"); if (!c) return;
  const coul = (email) => String(email).startsWith("dropbox:") ? "#0061fe" : identite(email)?.coul ?? "#8a8578";
  const estDropbox = cl.compte.startsWith("dropbox:");
  c.querySelector(".comptes").innerHTML = cl.comptes.map((x) =>
    `<button data-compte="${esc(x.email)}" class="${x.email === cl.compte ? "actif" : ""}"><span class="pastille" style="display:inline-block;background:${coul(x.email)}"></span> ${esc(x.libelle)}</button>`).join("")
    + `<button id="cl-ajout" title="Connecter le compte EDM pour ranger dans son Drive">+ Drive EDM</button>`
    + `<button id="cl-dropbox" title="Connecter votre Dropbox">+ Dropbox</button>`;
  for (const b of c.querySelectorAll("[data-compte]")) b.onclick = () => {
    cl.compte = b.dataset.compte; cl.recherche = ""; c.querySelector(".outils input").value = "";
    cl.chemin = [{ id: "root", nom: cl.compte.startsWith("dropbox:") ? "Dropbox" : "Mon Drive" }]; chargerClasseur();
  };
  $("#cl-dropbox").hidden = (etat.moi.dropbox ?? []).length > 0;
  $("#cl-dropbox").onclick = () => { location.href = `${API}/dropbox-start?session=${encodeURIComponent(etat.session)}&retour=${encodeURIComponent(RETOUR)}`; };
  const dejaEdm = cl.comptes.some((x) => /ecole-edm\.fr/.test(x.email));
  $("#cl-ajout").hidden = dejaEdm;
  $("#cl-ajout").onclick = () => connecter(`&session=${encodeURIComponent(etat.session)}&compte=contact@ecole-edm.fr`);
  const actuel = cl.chemin[cl.chemin.length - 1];
  c.querySelector(".fil").innerHTML = cl.recherche ? `Résultats pour « ${esc(cl.recherche)} »`
    : cl.chemin.map((x, i) => i < cl.chemin.length - 1 ? `<a data-niveau="${i}">${esc(x.nom)}</a>` : `<b>${esc(x.nom)}</b>`).join(" › ")
      + (cl.chemin.length === 1 && !estDropbox ? ` · <a data-partages>Partagés avec moi</a>` : "");
  for (const a of c.querySelectorAll("[data-niveau]")) a.onclick = () => { cl.chemin = cl.chemin.slice(0, Number(a.dataset.niveau) + 1); chargerClasseur(); };
  const p = c.querySelector("[data-partages]"); if (p) p.onclick = () => { cl.chemin.push({ id: "partages", nom: "Partagés avec moi" }); chargerClasseur(); };
  c.querySelector(".bas .meta").textContent = cl.recherche ? "Ouvrez un dossier pour le choisir." : `Destination : ${actuel.nom} (${cl.compte})`;
  $("#cl-ranger").disabled = !!cl.recherche || actuel.id === "partages";
  $("#cl-nouveau").disabled = !!cl.recherche || actuel.id === "partages";
  const g = c.querySelector(".grille");
  g.innerHTML = `<div class="vide" style="grid-column:1/-1">Chargement…</div>`;
  try {
    const r = await api("drive_dossiers", { compte: cl.compte, parent: actuel.id, recherche: cl.recherche || undefined });
    c.querySelector(".recents").innerHTML = `<h4>Dossiers récents</h4>` + (r.recents.length
      ? r.recents.map((x, i) => `<div data-recent="${i}" title="${esc(x.nom)} (${esc(x.compte)})"><span class="pastille" style="display:inline-block;background:${coul(x.compte)}"></span> ${esc(x.nom)}</div>`).join("")
      : `<div style="cursor:default;color:var(--doux)">Aucun pour l'instant</div>`);
    for (const el of c.querySelectorAll("[data-recent]")) el.onclick = () => { const x = r.recents[Number(el.dataset.recent)]; rangerIci(x.compte, x.id, x.nom); };
    g.innerHTML = r.dossiers.length ? r.dossiers.map((x, i) =>
      `<div class="dossier" data-d="${i}" title="${esc(x.name)}"><i style="background:${coul(cl.compte)}"></i>${ICONE_DOSSIER(x.folderColorRgb || (estDropbox ? "#7fa7f5" : "#8fb3e8"))}<span>${esc(x.name)}</span></div>`).join("")
      : `<div class="vide" style="grid-column:1/-1">Aucun sous-dossier. Vous pouvez ranger ici.</div>`;
    for (const el of g.querySelectorAll("[data-d]")) el.onclick = () => {
      const x = r.dossiers[Number(el.dataset.d)];
      if (cl.recherche) { cl.recherche = ""; c.querySelector(".outils input").value = ""; cl.chemin = [{ id: "root", nom: estDropbox ? "Dropbox" : "Mon Drive" }]; }
      cl.chemin.push({ id: x.id, nom: x.name }); chargerClasseur();
    };
  } catch (e) { g.innerHTML = `<div class="vide" style="grid-column:1/-1">${esc(e.message)}</div>`; }
}

async function rangerIci(compteDrive, dossierId, dossierNom) {
  const b = $("#cl-ranger"); b.disabled = true; b.textContent = "Rangement…";
  try {
    const r = await api("ranger_pj", { compte: cl.compteMail, message_id: cl.msg.id, attachment_id: cl.pj.attachmentId,
      nom: cl.pj.nom, mime: cl.pj.mime, drive_compte: compteDrive, dossier_id: dossierId, dossier_nom: dossierNom });
    fermerClasseur();
    toast(`Rangé dans « ${dossierNom} »`);
  } catch (e) { toast(e.message); b.disabled = false; b.textContent = "Ranger ici"; }
}

async function classer(m, processus_id) {
  await api("classer", { compte: m.compte, id: m.id, processus_id });
  for (const x of etat.messages) if (x.thread_id === m.thread_id) x.processus_id = processus_id;
  etat.moi = await api("moi");
  dessinerNav(); dessinerListe();
  toast(`Classé dans ${nomProc(processus_id)?.nom}`);
}

$("#connexion").onclick = () => connecter();
$("#ajout").onclick = () => connecter(`&session=${encodeURIComponent(etat.session)}&compte=manuel.zacklad.cnam@gmail.com`);
$("#sortie").onclick = () => deconnecter();
$("#recherche").onkeydown = (ev) => {
  if (ev.key === "Enter" && etat.vue?.boite) ouvrirDossier(etat.vue.boite, etat.vue.dossier, ev.target.value.trim() || undefined);
};
demarrer();
</script>
</body>
