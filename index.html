<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Courrier</title>
<link rel="icon" type="image/svg+xml" href="icone.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1d55d6">
<style>
  :root {
    --fond: #f6f5f2; --panneau: #ffffff; --ligne: #e3e0d9; --texte: #23221f; --doux: #6f6b63;
    --accent: #2f6fb3; --survol: #eef2f8; --sel: #e2ebf6;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; color: var(--texte); background: var(--fond); height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--ligne); background: var(--panneau); }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .2px; }
  header .esp { flex: 1; }
  header input[type=search] { width: 320px; padding: 6px 10px; border: 1px solid var(--ligne); border-radius: 8px; font: inherit; }
  button { font: inherit; border: 1px solid var(--ligne); background: var(--panneau); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
  button:hover { background: var(--survol); }
  button.principal { background: var(--accent); color: #fff; border-color: var(--accent); }
  main { flex: 1; display: grid; grid-template-columns: 240px 400px 1fr; min-height: 0; }
  nav, #liste, #lecture { overflow: auto; min-height: 0; }
  nav { border-right: 1px solid var(--ligne); padding: 10px 0; background: #fbfaf8; }
  nav h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--doux); margin: 14px 16px 4px; }
  .entree { display: flex; align-items: center; gap: 8px; padding: 5px 16px; cursor: pointer; border-left: 3px solid transparent; }
  .entree:hover { background: var(--survol); }
  .entree.actif { background: var(--sel); border-left-color: var(--accent); font-weight: 600; }
  .entree.cible { background: #dff0e2; outline: 2px dashed #3f8f4f; outline-offset: -2px; }
  .pastille { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .entree .nb { margin-left: auto; font-size: 12px; color: var(--doux); }
  #liste { border-right: 1px solid var(--ligne); background: var(--panneau); }
  .msg { padding: 9px 14px; border-bottom: 1px solid var(--ligne); cursor: pointer; }
  .msg:hover { background: var(--survol); }
  .msg.sel { background: var(--sel); }
  .msg.nonlu .de, .msg.nonlu .obj { font-weight: 700; }
  .msg .l1 { display: flex; gap: 8px; align-items: baseline; }
  .msg .de { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .msg .date { font-size: 12px; color: var(--doux); flex: none; }
  .msg .obj { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .msg .ext { font-size: 12.5px; color: var(--doux); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .etiq { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 6px; color: #fff; margin-right: 4px; vertical-align: 1px; }
  #lecture { padding: 18px 22px; background: var(--panneau); display: flex; flex-direction: column; }
  #lecture h2 { margin: 0 0 6px; font-size: 18px; }
  .meta { color: var(--doux); font-size: 13px; margin-bottom: 10px; }
  .barre { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 6px 0 12px; }
  select { font: inherit; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--ligne); }
  iframe { flex: 1; width: 100%; border: 1px solid var(--ligne); border-radius: 8px; min-height: 400px; background: #fff; }
  pre.texte { white-space: pre-wrap; font: inherit; }
  .pj { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .pj span { border: 1px solid var(--ligne); border-radius: 8px; padding: 3px 8px; font-size: 12.5px; }
  .vide { color: var(--doux); padding: 30px; text-align: center; }
  #accueil { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; }
  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #23221f; color: #fff; padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.vu { opacity: .92; }
  .plus { text-align: center; padding: 10px; }
  .filtres { position: sticky; top: 0; z-index: 1; background: var(--panneau); display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--ligne); }
  .filtres button { padding: 3px 9px; font-size: 12.5px; border-radius: 14px; }
  .filtres button.actif { background: var(--accent); color: #fff; border-color: var(--accent); }
  .imp { color: #e3a008; font-size: 13px; margin-right: 2px; }
  .onglets { position: sticky; top: 0; z-index: 1; background: var(--panneau); display: flex; border-bottom: 1px solid var(--ligne); overflow-x: auto; }
  .onglets button { border: 0; border-bottom: 3px solid transparent; border-radius: 0; padding: 10px 12px; background: none; white-space: nowrap; font-size: 13px; color: var(--doux); }
  .onglets button.actif { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .badge { display: inline-block; font-size: 10.5px; color: #fff; border-radius: 8px; padding: 0 5px; margin-left: 4px; font-weight: 600; }
  .etoile { cursor: pointer; color: #b8b3a8; font-size: 15px; margin-right: 4px; }
  .etoile.oui { color: #e3a008; }
  .nbfil { color: var(--doux); font-size: 12px; margin-left: 4px; }
  .carte { border: 1px solid var(--ligne); border-radius: 8px; margin-bottom: 10px; }
  .carte .tete { padding: 10px 12px; cursor: pointer; display: flex; gap: 10px; align-items: baseline; }
  .carte .tete b { flex: none; }
  .carte .tete .ex { flex: 1; color: var(--doux); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
  .carte .tete .dt { color: var(--doux); font-size: 12px; flex: none; }
  .carte .corps { padding: 0 12px 12px; }
  .carte iframe { min-height: 120px; flex: none; }
  .carte.brouillon { border-color: #e8a33d; background: #fffaf1; }
  .carte .tag { font-size: 11px; color: #9a5b00; background: #fde7c2; border-radius: 6px; padding: 0 6px; flex: none; }
  .actions-brouillon { display: flex; gap: 8px; margin-top: 8px; }
  #lecture { display: block; }
</style>
</head>
<body>
<header>
  <img src="icone.svg" alt="" width="26" height="26" style="border-radius:6px">
  <h1>Courrier</h1>
  <input type="search" id="recherche" placeholder="Rechercher (syntaxe Gmail)" hidden>
  <span class="esp"></span>
  <select id="fichiers" hidden title="Fichiers de suivi alimentés par Courrier"><option value="">Fichiers de suivi…</option></select>
  <span id="qui" class="meta" style="margin:0"></span>
  <button id="ajout" hidden title="Connecter un autre compte Gmail">+ Compte</button>
  <button id="sortie" hidden>Déconnexion</button>
</header>

<div id="accueil">
  <p>Connectez votre compte Gmail pour commencer.</p>
  <button class="principal" id="connexion">Se connecter avec Google</button>
</div>

<main id="app" hidden>
  <nav id="nav"></nav>
  <section id="liste"></section>
  <section id="lecture"><div class="vide">Sélectionnez une conversation.</div></section>
</main>
<div id="toast"></div>

<script>
const API = "https://gcghlwjuekhbueljpldk.supabase.co/functions/v1";
const RETOUR = location.origin + location.pathname;
const $ = (s) => document.querySelector(s);
const dec = (s) => { const t = document.createElement("textarea"); t.innerHTML = s ?? ""; return t.value; };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const memo = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch { return null; } };

// Couleur de la « casquette » selon l'adresse de réception
const IDENTITES = [
  [/ecole-edm\.fr|ecole\.transitions|design-mutation/i, "EDM", "#2f6fb3"],
  [/manuel\.zacklad\.cnam@gmail/i, "Recrutement", "#3f8f4f"],
  [/lecnam\.net|cnam\.fr/i, "CNAM", "#b3442f"],
  [/zacklad\.org|manuel\.experience|zacklad@gmail|pluriverse/i, "Perso", "#7a5bb3"],
];
function identite(dest) {
  for (const [re, nom, coul] of IDENTITES) if (re.test(dest || "")) return { nom, coul };
  return null;
}

// Dossiers Gmail affichés pour chaque compte
const DOSSIERS = [
  ["Boîte de réception", "INBOX"],
  ["Messages suivis", "is:starred"],
  ["En attente", "in:snoozed"],
  ["Important", "is:important"],
  ["Messages envoyés", "in:sent"],
  ["Brouillons", "in:draft"],
  ["Tous les messages", "in:anywhere -in:spam -in:trash"],
];
// Onglets de la boîte de réception, comme dans Gmail
const ONGLETS = [
  ["Principale", "primary", "#1d55d6"],
  ["Promotions", "promotions", "#2f8f4f"],
  ["Réseaux sociaux", "social", "#2f6fb3"],
  ["Notifications", "updates", "#e8710a"],
  ["Forums", "forums", "#7a5bb3"],
];

let etat = { session: null, moi: null, vue: null, messages: [], pageToken: null, sel: null, compteurs: {} };

function toast(t) { const e = $("#toast"); e.textContent = t; e.classList.add("vu"); setTimeout(() => e.classList.remove("vu"), 2200); }

async function api(action, corps = {}) {
  const r = await fetch(`${API}/api`, {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-session": etat.session },
    body: JSON.stringify({ action, ...corps }),
  });
  const d = await r.json();
  if (r.status === 401) { deconnecter(false); throw new Error("Session expirée"); }
  if (d.erreur) throw new Error(d.erreur);
  return d;
}

function connecter(extra = "") {
  location.href = `${API}/oauth-start?retour=${encodeURIComponent(RETOUR)}${extra}`;
}

function deconnecter(serveur = true) {
  if (serveur && etat.session) api("deconnexion").catch(() => {});
  try { localStorage.removeItem("courrier.session"); } catch {}
  etat.session = null;
  $("#app").hidden = true; $("#accueil").hidden = false;
  $("#ajout").hidden = $("#sortie").hidden = $("#recherche").hidden = true;
  $("#qui").textContent = "";
}

async function demarrer() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("erreur")) {
    history.replaceState(null, "", location.pathname);
    $("#accueil").insertAdjacentHTML("afterbegin", `<p style="color:#b3442f;max-width:560px;text-align:center">${esc(h.get("erreur"))}</p>`);
  }
  if (h.get("session")) {
    memo("courrier.session", h.get("session"));
    history.replaceState(null, "", location.pathname);
  }
  etat.session = h.get("session") || memo("courrier.session");
  if (!etat.session) return;
  try { etat.moi = await api("moi"); } catch { return; }
  $("#accueil").hidden = true; $("#app").hidden = false;
  $("#ajout").hidden = $("#sortie").hidden = $("#recherche").hidden = false;
  chargerFichiers();
  $("#qui").textContent = etat.moi.comptes.map((c) => c.email).join(" · ");
  dessinerNav();
  const principal = etat.moi.comptes.find((c) => c.role === "principal") || etat.moi.comptes[0];
  ouvrirDossier(principal.email, "INBOX");
}

// ---------- Fichiers de suivi (menu déroulant de l'en-tête) ----------
async function chargerFichiers() {
  try {
    const { fichiers } = await api("fichiers");
    const sel = $("#fichiers");
    sel.innerHTML = `<option value="">Fichiers de suivi…</option>` + fichiers.map((f) => `<option value="${esc(f.url)}">${esc(f.nom)}</option>`).join("");
    sel.hidden = !fichiers.length;
    sel.onchange = () => { if (sel.value) window.open(sel.value, "_blank", "noopener"); sel.value = ""; };
  } catch {}
}

// ---------- Navigation ----------
function dessinerNav() {
  const { comptes, processus, compteurs } = etat.moi;
  let h = "";
  for (const c of comptes) {
    const id = identite(c.email);
    h += `<h2>${esc(c.role === "recrutement" ? "Recrutement · " : "")}${esc(c.email)}</h2>`;
    const liste = c.role === "recrutement" ? DOSSIERS.filter(([, q]) => ["INBOX", "in:sent", "is:starred"].includes(q)) : DOSSIERS;
    for (const [nom, q] of liste) {
      h += `<div class="entree" data-boite="${esc(c.email)}" data-q="${esc(q)}"><span class="pastille" style="background:${q === "INBOX" ? (id?.coul ?? "#999") : "transparent"}"></span>${esc(nom)}</div>`;
    }
  }
  const parCasquette = {};
  for (const p of processus) (parCasquette[p.casquette] ??= []).push(p);
  for (const [cas, liste] of Object.entries(parCasquette)) {
    h += `<h2>${esc(cas)}</h2>`;
    for (const p of liste) {
      const n = compteurs[p.id];
      h += `<div class="entree" data-processus="${p.id}"><span class="pastille" style="background:${esc(p.couleur || "#999")}"></span>${esc(p.nom)}<span class="nb">${n ?? ""}</span></div>`;
    }
  }
  $("#nav").innerHTML = h;
  for (const e of document.querySelectorAll("[data-boite]")) e.onclick = () => ouvrirDossier(e.dataset.boite, e.dataset.q);
  for (const e of document.querySelectorAll("[data-processus]")) {
    e.onclick = () => ouvrirProcessus(e.dataset.processus);
    e.ondragover = (ev) => { ev.preventDefault(); e.classList.add("cible"); };
    e.ondragleave = () => e.classList.remove("cible");
    e.ondrop = async (ev) => {
      ev.preventDefault(); e.classList.remove("cible");
      await classer(JSON.parse(ev.dataTransfer.getData("text/plain")), e.dataset.processus);
    };
  }
  marquerNav();
}

function marquerNav() {
  for (const e of document.querySelectorAll(".entree")) {
    const actif = (etat.vue?.boite && e.dataset.boite === etat.vue.boite && e.dataset.q === etat.vue.dossier) ||
      (etat.vue?.processus && e.dataset.processus === etat.vue.processus);
    e.classList.toggle("actif", !!actif);
  }
}

// ---------- Listes ----------
function requete() {
  const v = etat.vue;
  if (v.recherche) return v.recherche;
  if (v.dossier === "INBOX") return `in:inbox category:${v.onglet}`;
  return v.dossier;
}

async function ouvrirDossier(email, dossier, recherche) {
  etat.vue = { boite: email, dossier, onglet: memo("courrier.onglet") || "primary", recherche };
  etat.sel = null;
  marquerNav();
  await chargerListe();
  if (dossier === "INBOX" && !recherche) {
    api("compteurs_onglets", { compte: email }).then((c) => { etat.compteurs = c; dessinerListe(); }).catch(() => {});
  }
}

async function chargerListe() {
  $("#liste").innerHTML = barre() + `<div class="vide">Chargement…</div>`;
  brancherBarre();
  try {
    const d = await api("fils", { compte: etat.vue.boite, q: requete() });
    etat.messages = d.messages.map((m) => ({ ...m, compte: etat.vue.boite }));
    etat.pageToken = d.pageToken;
    dessinerListe();
  } catch (e) { $("#liste").innerHTML = barre() + `<div class="vide">${esc(e.message)}</div>`; brancherBarre(); }
}

async function plus() {
  const d = await api("fils", { compte: etat.vue.boite, q: requete(), pageToken: etat.pageToken });
  etat.messages.push(...d.messages.map((m) => ({ ...m, compte: etat.vue.boite })));
  etat.pageToken = d.pageToken;
  dessinerListe();
}

async function ouvrirProcessus(id) {
  etat.vue = { processus: id };
  marquerNav();
  $("#liste").innerHTML = `<div class="vide">Chargement…</div>`;
  const d = await api("processus_messages", { processus_id: id });
  etat.messages = d.messages.map((m) => ({ ...m, compte: m.compte_email, participants: [nomExp(m.expediteur)], nb: 1 }));
  etat.pageToken = null;
  dessinerListe();
}

function barre() {
  const v = etat.vue;
  if (!v?.boite || v.dossier !== "INBOX" || v.recherche) return "";
  return `<div class="onglets">${ONGLETS.map(([nom, cat, coul]) => {
    const n = etat.compteurs[cat];
    const badge = n && cat !== "primary" ? `<span class="badge" style="background:${coul}">${n >= 100 ? "99+" : n} nouveaux</span>` : "";
    return `<button data-onglet="${cat}" class="${v.onglet === cat ? "actif" : ""}">${esc(nom)}${badge}</button>`;
  }).join("")}</div>`;
}

function brancherBarre() {
  for (const b of document.querySelectorAll(".onglets button")) b.onclick = () => {
    memo("courrier.onglet", b.dataset.onglet);
    etat.vue.onglet = b.dataset.onglet;
    chargerListe();
  };
}

function nomProc(id) { return etat.moi.processus.find((p) => p.id === id); }

function dateCourte(iso) {
  const d = new Date(iso), auj = new Date();
  return d.toDateString() === auj.toDateString()
    ? d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })
    : d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
}

function nomExp(de) { return (de || "").replace(/<.*>/, "").replace(/"/g, "").trim() || de; }

function dessinerListe() {
  if (!etat.messages.length) { $("#liste").innerHTML = barre() + `<div class="vide">Aucun message.</div>`; brancherBarre(); return; }
  $("#liste").innerHTML = barre() + etat.messages.map((m, i) => {
    const id = identite(m.destinataires);
    const p = m.processus_id && nomProc(m.processus_id);
    const qui = (m.participants?.length ? m.participants.slice(0, 3).join(", ") : nomExp(m.expediteur));
    return `<div class="msg ${m.non_lu ? "nonlu" : ""} ${etat.sel === m.thread_id ? "sel" : ""}" draggable="true" data-i="${i}">
      <div class="l1">${m.suivi !== undefined ? `<span class="etoile ${m.suivi ? "oui" : ""}" data-etoile="${i}" title="Suivre">${m.suivi ? "★" : "☆"}</span>` : ""}<span class="de">${m.important ? `<span class="imp" title="Important">▶</span>` : ""}${esc(qui)}${m.nb > 1 ? `<span class="nbfil">${m.nb}</span>` : ""}</span><span class="date">${dateCourte(m.date)}</span></div>
      <div class="obj">${id ? `<span class="etiq" style="background:${id.coul}">${id.nom}</span>` : ""}${p ? `<span class="etiq" style="background:${esc(p.couleur)}">${esc(p.nom)}</span>` : ""}${esc(m.objet || "(sans objet)")}</div>
      <div class="ext">${esc(dec(m.extrait))}</div></div>`;
  }).join("") + (etat.pageToken ? `<div class="plus"><button id="btnplus">Plus de conversations</button></div>` : "");
  for (const e of document.querySelectorAll(".msg")) {
    const m = etat.messages[e.dataset.i];
    e.onclick = (ev) => { if (!ev.target.dataset.etoile) lire(m); };
    e.ondragstart = (ev) => ev.dataTransfer.setData("text/plain", JSON.stringify({ id: m.id, compte: m.compte, thread_id: m.thread_id }));
  }
  for (const e of document.querySelectorAll("[data-etoile]")) e.onclick = async (ev) => {
    ev.stopPropagation();
    const m = etat.messages[e.dataset.etoile];
    m.suivi = !m.suivi; dessinerListe();
    api("suivre", { compte: m.compte, thread_id: m.thread_id, oui: m.suivi }).catch((er) => toast(er.message));
  };
  if ($("#btnplus")) $("#btnplus").onclick = plus;
  brancherBarre();
}

// ---------- Lecture d'une conversation ----------
async function lire(m) {
  etat.sel = m.thread_id;
  dessinerListe();
  const zone = $("#lecture");
  zone.innerHTML = `<div class="vide">Chargement…</div>`;
  try {
    const d = await api("fil", { compte: m.compte, thread_id: m.thread_id });
    const dernierIdx = d.messages.length - 1;
    const opts = `<option value="">Classer dans…</option>` + etat.moi.processus.map((p) =>
      `<option value="${p.id}" ${p.id === m.processus_id ? "selected" : ""}>${esc(p.casquette)} / ${esc(p.nom)}</option>`).join("");
    zone.innerHTML = `
      <h2>${esc(d.messages[0]?.objet || "(sans objet)")}</h2>
      <div class="barre"><select id="classer">${opts}</select>
        <a href="https://mail.google.com/mail/?authuser=${encodeURIComponent(m.compte)}#all/${d.thread_id}" target="_blank" rel="noopener"><button>Ouvrir dans Gmail</button></a>
        <a href="https://links.mimestream.com/g/${encodeURIComponent(m.compte)}/m/${(d.messages.filter((x) => !x.brouillon).pop() ?? d.messages[0]).id}" target="_blank" rel="noopener"><button>Ouvrir dans Mimestream</button></a></div>
      ${d.messages.map((x, i) => `
        <div class="carte${x.brouillon ? " brouillon" : ""}" data-c="${i}">
          <div class="tete">${x.brouillon ? `<span class="tag">Brouillon</span>` : ""}<b>${esc(nomExp(x.expediteur))}</b><span class="ex">${i === dernierIdx ? esc("À " + x.destinataires) : esc(dec(x.extrait))}</span><span class="dt">${new Date(x.date).toLocaleString("fr-FR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}</span></div>
          <div class="corps" ${i === dernierIdx || x.brouillon ? "" : "hidden"}>
            ${x.brouillon ? `<div class="meta">À ${esc(x.destinataires)}</div>` : ""}
            ${x.cc ? `<div class="meta">Cc ${esc(x.cc)}</div>` : ""}
            ${x.pieces_jointes.length ? `<div class="pj">${x.pieces_jointes.map((p) => `<span>📎 ${esc(p.nom)}</span>`).join("")}</div>` : ""}
            <iframe sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin" data-f="${i}"></iframe>
            ${x.brouillon && x.draft_id ? `<div class="actions-brouillon">
              <button class="principal" data-envoyer="${esc(x.draft_id)}">Envoyer ce brouillon</button>
              <a href="https://links.mimestream.com/g/${encodeURIComponent(m.compte)}/m/${x.id}" target="_blank" rel="noopener"><button>Modifier dans Mimestream</button></a>
              <select data-signature="${esc(x.draft_id)}" title="Signature du brouillon">
                <option value="">Signature…</option>
                ${(etat.moi.signatures ?? []).map((g) => `<option value="${g.id}">${esc(g.nom)}</option>`).join("")}
                <option value="aucune">Aucune signature</option>
              </select>
              <button data-supprimer="${esc(x.draft_id)}" style="margin-left:auto">Supprimer ce brouillon</button>
            </div>` : ""}
          </div>
        </div>`).join("")}`;
    d.messages.forEach((x, i) => {
      const f = zone.querySelector(`iframe[data-f="${i}"]`);
      const html = x.html || `<pre style="white-space:pre-wrap;font:14px/1.5 sans-serif">${esc(x.texte)}</pre>`;
      f.onload = () => { try { f.style.height = (f.contentDocument.body.scrollHeight + 24) + "px"; } catch {} };
      f.srcdoc = `<base target="_blank"><style>body{font:14px/1.5 sans-serif;margin:8px;word-wrap:break-word}img{max-width:100%;height:auto}</style>${html}`;
    });
    for (const c of zone.querySelectorAll(".carte .tete")) c.onclick = () => {
      const corps = c.nextElementSibling; corps.hidden = !corps.hidden;
      const f = corps.querySelector("iframe"); if (!corps.hidden && f?.onload) f.onload();
    };
    $("#classer").onchange = (ev) => ev.target.value && classer(m, ev.target.value);
    for (const sel of zone.querySelectorAll("[data-signature]")) sel.onchange = async () => {
      if (!sel.value) return;
      sel.disabled = true;
      try {
        await api("changer_signature", { compte: m.compte, draft_id: sel.dataset.signature, signature_id: sel.value === "aucune" ? null : sel.value });
        toast(sel.value === "aucune" ? "Signature retirée" : "Signature changée"); lire(m);
      } catch (er) { toast(er.message); sel.disabled = false; sel.value = ""; }
    };
    for (const b of zone.querySelectorAll("[data-supprimer]")) b.onclick = async () => {
      if (!confirm("Supprimer définitivement ce brouillon ?")) return;
      b.disabled = true;
      try { await api("supprimer_brouillon", { compte: m.compte, draft_id: b.dataset.supprimer }); toast("Brouillon supprimé"); lire(m); }
      catch (er) { toast(er.message); b.disabled = false; }
    };
    for (const b of zone.querySelectorAll("[data-envoyer]")) b.onclick = async () => {
      const x = d.messages.find((y) => y.draft_id === b.dataset.envoyer);
      if (!confirm(`Envoyer ce brouillon à ${x?.destinataires || "son destinataire"}${x?.cc ? " (copie : " + x.cc + ")" : ""} ?`)) return;
      b.disabled = true; b.textContent = "Envoi…";
      try { await api("envoyer_brouillon", { compte: m.compte, draft_id: b.dataset.envoyer }); toast("Message envoyé"); lire(m); }
      catch (er) { toast(er.message); b.disabled = false; b.textContent = "Envoyer ce brouillon"; }
    };
    if (m.non_lu) { api("fil_lu", { compte: m.compte, thread_id: m.thread_id }).catch(() => {}); m.non_lu = false; dessinerListe(); }
  } catch (e) { zone.innerHTML = `<div class="vide">${esc(e.message)}</div>`; }
}

async function classer(m, processus_id) {
  await api("classer", { compte: m.compte, id: m.id, processus_id });
  for (const x of etat.messages) if (x.thread_id === m.thread_id) x.processus_id = processus_id;
  etat.moi = await api("moi");
  dessinerNav(); dessinerListe();
  toast(`Classé dans ${nomProc(processus_id)?.nom}`);
}

$("#connexion").onclick = () => connecter();
$("#ajout").onclick = () => connecter(`&session=${encodeURIComponent(etat.session)}&compte=manuel.zacklad.cnam@gmail.com`);
$("#sortie").onclick = () => deconnecter();
$("#recherche").onkeydown = (ev) => {
  if (ev.key === "Enter" && etat.vue?.boite) ouvrirDossier(etat.vue.boite, etat.vue.dossier, ev.target.value.trim() || undefined);
};
demarrer();
</script>
</body>
